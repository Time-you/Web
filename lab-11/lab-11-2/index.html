<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Туристичне агентство</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0}
header{background:#0b6fa4;color:white;padding:20px;text-align:center}
nav{background:#eee;padding:10px;text-align:center}
nav a{margin:0 10px;text-decoration:none}
.container{display:flex;flex-wrap:wrap}
.card{flex:1 1 300px;border:1px solid #ccc;margin:10px;padding:10px}
footer{background:#333;color:white;text-align:center;padding:15px}
img{max-width:100%;height:auto}
</style>
</head>
<body>
<header>
<h1>Travel World</h1>
<p>Подорожуйте разом з нами</p>
</header>

<nav>
<a href="#">Головна</a>
<a href="#">Тури</a>
<a href="#">Акції</a>
<a href="#">Контакти</a>
</nav>

<div class="container">
<div class="card">
<h2>Єгипет</h2>
<img src="https://via.placeholder.com/400x200?text=Egypt">
<p>Відпочинок на Червоному морі.</p>
</div>

<div class="card">
<h2>Туреччина</h2>
<img src="https://via.placeholder.com/400x200?text=Turkey">
<p>Все включено за доступними цінами.</p>
</div>

<div class="card">
<h2>Італія</h2>
<img src="https://via.placeholder.com/400x200?text=Italy">
<p>Екскурсійні тури та відпочинок.</p>
</div>
</div>

<footer>
Іванський Володимир © 2025
</footer>
</body>
</html>
