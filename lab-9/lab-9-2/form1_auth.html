<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Форма 1 — авторизація</title>
<style>*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef5ff;margin:0;color:#222}
header{background:#123b68;color:white;padding:24px;text-align:center}
main{max-width:980px;margin:25px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 0 12px rgba(0,0,0,.12)}
h1,h2{margin-top:0}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
nav a,.btn{display:inline-block;background:#1667b7;color:white;text-decoration:none;padding:12px 16px;border-radius:8px;border:0;cursor:pointer;font-size:16px}
nav a:hover,.btn:hover{background:#0c4f91}
label{display:block;margin-top:14px;font-weight:bold}
input,select,textarea{width:100%;padding:9px;margin-top:5px;border:1px solid #999;border-radius:6px;font-size:15px}
input[type=checkbox],input[type=radio]{width:auto;margin-right:8px}
.inline label{font-weight:normal;margin:8px 0}
.error{color:#b00020;font-weight:bold;margin-top:12px}
.ok{color:#0b7a21;font-weight:bold;margin-top:12px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions{margin-top:18px;display:flex;gap:10px}
.note{background:#f3f7ff;border-left:5px solid #1667b7;padding:12px;margin:15px 0}
footer{text-align:center;margin-top:25px}
table{width:100%;border-collapse:collapse;margin-top:15px}
td,th{border:1px solid #aaa;padding:10px;text-align:left}
</style>
<script>function showError(formId, message){
    const box = document.querySelector("#" + formId + " .message");
    box.className = "message error";
    box.textContent = message;
}
function showOk(formId){
    const box = document.querySelector("#" + formId + " .message");
    box.className = "message ok";
    box.textContent = "Дані заповнено правильно. Форма може бути відправлена на сервер.";
}
function isLeap(year){
    return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
}
function validDate(y,m,d){
    y = Number(y); m = Number(m); d = Number(d);
    if(!y || !m || !d) return false;
    const days = [31, isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return m >= 1 && m <= 12 && d >= 1 && d <= days[m-1];
}
function validateAuth(){
    const login = document.forms["authForm"]["login"].value.trim();
    const password = document.forms["authForm"]["password"].value.trim();
    if(!/^[A-Za-z]{3,10}$/.test(login)){
        showError("authBox","Логін має бути від 3 до 10 символів і тільки латиницею.");
        return false;
    }
    if(!/^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{3,10}$/.test(password)){
        showError("authBox","Пароль має бути 3-10 символів, латиниця і цифри, мінімум одна велика літера та одна цифра.");
        return false;
    }
    showOk("authBox");
    return true;
}
function validateReview(){
    const review = document.forms["reviewForm"]["review"].value.trim();
    const rate = document.querySelector('input[name="rate"]:checked');
    if(review.length === 0){
        showError("reviewBox","Поле змісту відгуку обов'язково має бути заповнене.");
        return false;
    }
    if(!rate){
        showError("reviewBox","Потрібно виставити оцінку товару.");
        return false;
    }
    showOk("reviewBox");
    return true;
}
function validateSurvey(){
    const checked = document.querySelectorAll('input[name="answer"]:checked');
    if(checked.length < 1){
        showError("surveyBox","Потрібно вибрати хоча б один варіант відповіді.");
        return false;
    }
    showOk("surveyBox");
    return true;
}
function validateClinic(){
    const illness = document.forms["clinicForm"]["illness"].value.trim();
    const y = document.forms["clinicForm"]["year"].value;
    const m = document.forms["clinicForm"]["month"].value;
    const d = document.forms["clinicForm"]["day"].value;
    const hour = document.forms["clinicForm"]["hour"].value.trim();
    const minute = document.forms["clinicForm"]["minute"].value.trim();

    if(illness.length === 0){
        showError("clinicBox","Опис нездужання обов'язково має бути заповнений.");
        return false;
    }
    if(!validDate(y,m,d)){
        showError("clinicBox","Дата відвідування некоректна. Враховується кількість днів у місяці та 29 лютого.");
        return false;
    }
    if(!/^\d+$/.test(hour) || Number(hour) < 8 || Number(hour) > 16){
        showError("clinicBox","Година відвідування повинна бути від 8 до 16.");
        return false;
    }
    if(!/^\d+$/.test(minute) || Number(minute) < 0 || Number(minute) > 59){
        showError("clinicBox","Хвилини повинні бути від 0 до 59.");
        return false;
    }
    showOk("clinicBox");
    return true;
}
</script>
</head>
<body>
<header><h1>Форма 1 — авторизація</h1><p>Лабораторна робота №1. Вивчення структури протоколу HTTP. Варіант 4</p></header>
<main>

<section id="authBox">
<form name="authForm" action="https://google.com.ua" method="get" onsubmit="return validateAuth();">
<label>Логін</label>
<input type="text" name="login" placeholder="Наприклад: Ivan" required>
<label>Пароль</label>
<input type="password" name="password" placeholder="Наприклад: Abc123" required>
<div class="inline">
<label><input type="checkbox" name="remember" value="yes">Запам'ятати мене</label>
</div>
<div class="actions">
<input class="btn" type="submit" value="Відправити">
<input class="btn" type="reset" value="Очистити">
</div>
<p class="message"></p>
</form>
<p class="note">Перевірка: логін 3-10 символів, тільки латиниця. Пароль 3-10 символів, латиниця і цифри, мінімум одна велика літера та одна цифра.</p>
</section>

<footer><a href="index.html">На головну</a></footer>
</main>
</body>
</html>
