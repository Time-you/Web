<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><title>Форма пошуку</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef7ff;
        margin: 30px;
        color: #222;
    }
    h1, h2 {
        text-align: center;
        color: #003366;
    }
    .box {
        width: 760px;
        margin: 20px auto;
        background: white;
        border: 2px solid #777;
        padding: 20px;
        box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }
    table {
        margin: 10px auto;
    }
    input, select, textarea {
        margin: 4px;
        padding: 4px;
    }
    .required {
        color: #d00000;
        font-weight: bold;
    }
    .center {
        text-align: center;
    }
    .menu a {
        display: block;
        font-size: 20px;
        margin: 10px;
    }
    .form-table td {
        padding: 5px;
        font-size: 18px;
    }
    .gray-form {
        background: #dddddd;
        border: 2px solid #333;
        width: 430px;
        margin: 20px auto;
        padding: 15px;
    }
</style>
</head>
<body>
    <h1>Форма пошуку</h1>
    <div class="box center">
        <form name="input" action="html_form_action.asp" method="get">
            <table border="1" bgcolor="#ddffdd">
                <tr>
                    <td align="center">
                        <input type="text" name="search" size="50" value="Рядок для пошуку">
                        <input type="submit" value="Пошук">
                        <br>
                        <input type="checkbox" name="news">Шукати в новинах
                        <input type="checkbox" name="arhive">Шукати в архівах
                    </td>
                </tr>
            </table>
        </form>
    </div>
    <p class="center"><a href="index.html">На головну</a></p>
</body>
</html>
