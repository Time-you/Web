<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><title>Список вибору</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef7ff;
        margin: 30px;
        color: #222;
    }
    h1, h2 {
        text-align: center;
        color: #003366;
    }
    .box {
        width: 760px;
        margin: 20px auto;
        background: white;
        border: 2px solid #777;
        padding: 20px;
        box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }
    table {
        margin: 10px auto;
    }
    input, select, textarea {
        margin: 4px;
        padding: 4px;
    }
    .required {
        color: #d00000;
        font-weight: bold;
    }
    .center {
        text-align: center;
    }
    .menu a {
        display: block;
        font-size: 20px;
        margin: 10px;
    }
    .form-table td {
        padding: 5px;
        font-size: 18px;
    }
    .gray-form {
        background: #dddddd;
        border: 2px solid #333;
        width: 430px;
        margin: 20px auto;
        padding: 15px;
    }
</style>
</head>
<body>
    <h1>Командні кнопки та списки вибору</h1>
    <div class="box">
        <form name="input" action="html_form_action.asp" method="get">
            <br>
            Вибір ноутбука по виробнику:
            <select name="notebook">
                <option value="aser">Aser</option>
                <option value="asus">Asus</option>
                <option value="compaq">Lenovo</option>
                <option value="hp">HP</option>
                <option value="sony">Sony</option>
                <option value="toshiba">Toshiba</option>
            </select>
            <br><br>
            Знайти:
            <input type="text" name="search" size="25">
            <br><br>
            <input type="submit" value="Надіслати">
            <input type="reset" value="Скинути">
        </form>
    </div>
    <p class="center"><a href="index.html">На головну</a></p>
</body>
</html>
