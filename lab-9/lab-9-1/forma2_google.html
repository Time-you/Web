<!DOCTYPE html>
<html lang="uk">
<head><meta charset="UTF-8"><title>Передплата GOOGLE</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef7ff;
        margin: 30px;
        color: #222;
    }
    h1, h2 {
        text-align: center;
        color: #003366;
    }
    .box {
        width: 760px;
        margin: 20px auto;
        background: white;
        border: 2px solid #777;
        padding: 20px;
        box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }
    table {
        margin: 10px auto;
    }
    input, select, textarea {
        margin: 4px;
        padding: 4px;
    }
    .required {
        color: #d00000;
        font-weight: bold;
    }
    .center {
        text-align: center;
    }
    .menu a {
        display: block;
        font-size: 20px;
        margin: 10px;
    }
    .form-table td {
        padding: 5px;
        font-size: 18px;
    }
    .gray-form {
        background: #dddddd;
        border: 2px solid #333;
        width: 430px;
        margin: 20px auto;
        padding: 15px;
    }
</style>
</head>
<body>
    <h1>Передплата на новинне розсилання GOOGLE</h1>
    <div class="box">
        <form action="MAILTO:info@google.ru" method="post" enctype="text/plain">
            <h3>Передплата на новинне розсилання GOOGLE</h3>
            Ім'я:<br>
            <input type="text" name="name" value="ваше ім'я" size="20">
            <br>
            Mail:<br>
            <input type="text" name="mail" value="ваш e-mail" size="20">
            <br>
            Я хочу одержувати:
            <br>
            <input type="checkbox" name="news"> Новини про життя GOOGLE
            <br>
            <input type="checkbox" name="courses"> Інформацію про нові комп'ютери
            <br>
            <input type="checkbox" name="books"> Інформацію про нові сканери
            <br>
            Коментар:<br>
            <textarea rows="5" cols="30"></textarea>
            <hr>
            <input type="submit" value="Послати">
            <input type="reset" value="Відмінити">
        </form>
    </div>
    <p class="center"><a href="index.html">На головну</a></p>
</body>
</html>
