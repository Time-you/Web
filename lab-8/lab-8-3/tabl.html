<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таблиця</title>
    <style>
        body {
            background-color: #f0fff0;
            font-family: Arial, sans-serif;
            margin: 35px;
        }

        h1 {
            text-align: center;
            color: darkgreen;
        }

        table {
            width: 500px;
            border-collapse: collapse;
            margin: 30px auto;
        }

        td, th {
            border: 2px solid black;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .first-cell {
            background-color: #ffcc33;
        }
    </style>
</head>
<body>
    <h1>Таблиця</h1>

    <table>
        <tr>
            <td class="first-cell">HTML</td>
            <td>CSS</td>
            <td>JavaScript</td>
        </tr>
        <tr>
            <td>Фрейми</td>
            <td>Списки</td>
            <td>Таблиці</td>
        </tr>
        <tr>
            <td>Меню</td>
            <td>Посилання</td>
            <td>Сайт</td>
        </tr>
    </table>
</body>
</html>
