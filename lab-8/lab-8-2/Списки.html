<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Списки</title>
    <style>
        body {
            background-color: #fff8e6;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        li {
            font-size: 20px;
            margin: 6px;
        }
    </style>
</head>
<body>
    <h1>Створення списків в HTML</h1>

    <h2>Нумерований список</h2>
    <ol>
        <li>Створити HTML-файл.</li>
        <li>Додати основні теги сторінки.</li>
        <li>Записати потрібну інформацію.</li>
        <li>Зберегти файл і відкрити його у браузері.</li>
    </ol>

    <h2>Маркований список</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
</body>
</html>
